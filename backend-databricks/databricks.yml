bundle:
  name: retguard-v05

workspace:
  root_path: /Workspace/retguard/.bundle/${bundle.name}/${bundle.target}

resources:
  apps:
    retguard-v05:
      name: retguard-v05
      description: "RetentionGuard v05 - TCS workspace port (Lakebase control plane + Unity Catalog data plane)"
      source_code_path: .
      user_api_scopes:
        - postgres
        # On-Behalf-Of identity (x-forwarded-access-token -> current_user.me(), see rg/api.py's
        # current_user()) needs no extra scope here - iam.current-user:read/iam.access-control:read
        # are platform defaults (confirmed via this app's own effective_user_api_scopes before this
        # line even existed) and the API rejects explicitly re-requesting a default scope by name.
      resources:
        - name: postgres
          postgres:
            branch: projects/rglkbase/branches/production
            database: projects/rglkbase/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
      config:
        command: ["python", "app.py"]
        env:
          - name: LAKEBASE_ENDPOINT
            value_from: postgres

targets:
  dev:
    default: true
