bundle:
  name: retentionguard-v04

resources:
  apps:
    retentionguard-v04:
      name: retentionguard-v04
      description: "RetentionGuard v04 - Databricks-only data governance (Lakebase control plane + Unity Catalog data plane)"
      source_code_path: .
      user_api_scopes:
        - postgres
      resources:
        - name: postgres
          postgres:
            branch: projects/retentionguard-v04/branches/production
            database: projects/retentionguard-v04/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
      config:
        command: ["python", "app.py"]
        env:
          - name: LAKEBASE_ENDPOINT
            value_from: postgres

targets:
  dev:
    default: true
